# nav_node tuning (camera configuration). Loaded into ~ by nav.launch, re-read at every start;
# the web UI edits these on the parameter server and "save" writes this file back.
v_max: 0.8                # [m/s]
a_max: 1.0                # [m/s^2] acceleration, also the turning acceleration of the corner limits
a_brake: 1.2              # [m/s^2] braking every speed limit plans with (obstacles, lines, corners, sensor range)
react_time: 0.1           # [s] from seeing something to braking for it (sensor latency + control period)
stop_margin: 0.03         # [m] stop this short of the C-space boundary
v_tight: 0.15             # [m/s] speed with zero clearance
v_per_clearance: 8.0      # [m/s per m] extra speed per metre of clearance (3.0 crawled through wide gaps)
lookahead: 0.35           # [m] (visible-target pursuit, tracker 0 only)
tracker: 1                # 1: follow the path with rounded corners (track.h); 0: pure pursuit
keep_gap: 0.08            # [m] robot to obstacle a rounded corner keeps (less only where the path has less)
a_lat_frac: 0.8           # corners planned at this x a_max of lateral acceleration (the rest corrects)
k_track: 2.0              # [1/s] pull back onto the path
track_preview: 0.1        # [s] steer along the path this far ahead (latency)
route_keep: 0.7           # A* cost x this near the current path: a new route must be clearly better
k_heading: 1.5            # heading P gain
w_max: 1.0                # [rad/s]
safety_margin: 0.01       # [m] safety layer: footprint sweep margin (below the planner's 2 cm inflation)
max_obstacle_range: 2.5    # [m] obstacle map up to here (farther: far layer, if far_range is larger)
far_range: 4.0             # [m] far layer up to here (beyond max_obstacle_range): planner cost only; 0 = off
far_cost: 5.0             # planner step cost x this in the far obstacles' C-space
far_shrink: 0.1           # [m] that C-space from the footprint eroded by this (far cells are coarse: gaps >= 50 cm stay free)
red_line_max_range: 1.5   # [m] red-line fits only from closer points
wall_max_range: 2.5       # [m] low-wall fits only from closer points (camera)
line_margin_base: 0.02    # [m] keep-out inside the red lines ...
line_margin_sigma: 2.0    # ... plus this x sigma_y of the localisation
wall_margin: 0.08         # [m] + line_margin_sigma x sigma_x before the low wall (the x estimate drifts)
clear_margin: 0.02        # [m] beams clear the grid up to max(clear_margin, clear_sigmas x range sigma)
clear_sigmas: 2.0         #     short of the hit (a fixed 0.10 left far-reading noise as permanent ghosts)
recovery_after: 1.0       # [s] no path this long: forget obstacles beyond 1 m
no_path_timeout: 3.0      # [s] no path this long: SAFE_STOP
