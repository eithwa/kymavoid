# Field and challenge specification, shared by avoid_nav and avoid_sim.
# Source of truth: the original Gazebo avoid-challenge world (docs/avoidance-redesign-plan.md, 2.1).
# Field frame: x from the start towards the goal, y to the left, origin at the field centre.
field:
  surface: {x_min: -3.0, x_max: 3.0, y_min: -2.0, y_max: 2.0}
  # Two red out-of-bounds lines at +/- red_line_y (centre line). Touching one loses the run.
  red_line_y: 1.5
  red_line_width: 0.05
  red_line_x_min: -3.0
  red_line_x_max: 3.0
  # Assumed (not in the original world): start line and goal line positions.
  start_line_x: -2.0
  goal_line_x: 3.0
  # The robot starts centred on the start line, facing the goal.
  start_pose: {x: -2.0, y: 0.0, yaw: 0.0}
  # Low black wall around the field (centre lines). The lidar cannot see it; the camera can.
  wall_x: 3.55
  wall_y: 2.55
  wall_thickness: 0.15
  wall_height: 0.20

obstacles:
  count: 8
  size: 0.45            # square boxes, axis aligned
  height: 1.0
  # Random layouts: every pair must leave at least min_gap free.
  #   axis:      max(gap_x, gap_y) >= min_gap  -> the non-rotating robot can always pass between two boxes
  #   euclidean: corner-to-corner distance >= min_gap
  min_gap: 0.50
  gap_metric: axis
  # 'route' layouts (avoid_sim): no gap spec, boxes at any distance (touching, not overlapping); only one
  # route this wide must lead to the goal line (a disc of this diameter fits all the way, red lines included)
  route_width: 0.50
  # Obstacle centres are drawn in this x range; in y they stay inside the red lines (may touch them).
  x_min: -1.3
  x_max: 2.5
